<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administrador Lopes 2.0</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#071d39,#0b5dcc)}.box{width:100%;max-width:390px;background:#fff;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0004}.logo{font-weight:900;font-size:23px;color:#0b4dbb}.logo span{color:#ff8a00}h1{margin:18px 0 6px}.muted{color:#718096;font-size:14px}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #dce2ea;border-radius:11px}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#0b4dbb;color:#fff;width:100%}.app{display:none}.side{position:fixed;left:0;top:0;bottom:0;width:235px;background:#071d39;color:#fff;padding:20px 14px}.brand{padding:8px 10px 25px}.brand .logo{color:#fff}.nav button{display:block;width:100%;padding:13px 11px;margin:4px 0;border:0;border-radius:10px;text-align:left;background:transparent;color:#dce8f7;font-weight:700}.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}.main{margin-left:235px;padding:25px;max-width:1300px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.pill{background:#fff;border-radius:20px;padding:9px 13px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border-radius:17px;padding:18px;box-shadow:0 3px 16px #1720330b;margin-bottom:16px}.label{font-size:13px;color:#718096}.value{font-size:27px;font-weight:900;margin:7px 0}.orange{color:#ff8a00}.green{color:#178957}.red{color:#c83c3c}.yellow{color:#b7791f}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 8px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px;white-space:nowrap}.badge{padding:5px 9px;border-radius:20px;background:#e7f7ee;color:#178957;font-weight:800;font-size:11px}.badge.red{background:#fff0f0}.badge.yellow{background:#fff7df;color:#9a6700}.actions{display:flex;gap:6px}.small{padding:7px 9px;font-size:11px}.secondary{background:#edf4ff;color:#0b4dbb}.danger{background:#fff0f0;color:#b42318}.notice{background:#fff7df;padding:13px;border-radius:13px;color:#765b16;margin-bottom:15px}@media(max-width:800px){.side{position:static;width:100%;height:auto}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.main{margin-left:0;padding:15px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="login" class="login"><div class="box"><div class="logo">LOPES <span>BUSINESS</span></div><h1>Administrador Lopes</h1><p class="muted">Painel financeiro e de controlo.</p><div class="field"><label>Utilizador</label><input id="u" placeholder="admin"></div><div class="field"><label>Senha</label><input id="p" type="password" placeholder="••••••••"></div><button class="btn primary" onclick="login()">Entrar</button><p id="err" class="muted" style="color:#c83c3c;display:none">Credenciais inválidas.</p><p class="muted" style="font-size:11px;margin-top:18px">Protótipo local. A autenticação real será feita no backend.</p></div></div>
<div id="app" class="app">
<aside class="side"><div class="brand"><div class="logo">LOPES <span>BUSINESS</span></div><small>ADMIN 2.0</small></div><nav class="nav">
<button class="active" onclick="page('dash',this)">🏠 Visão geral</button><button onclick="page('clients',this)">👥 Clientes</button><button onclick="page('subs',this)">📋 Assinaturas</button><button onclick="page('payments',this)">💳 Pagamentos</button><button onclick="page('finance',this)">💰 Financeiro</button><button onclick="logout()">🚪 Sair</button></nav></aside>
<main class="main"><div class="top"><h1 id="title">Visão geral</h1><div class="pill">👑 Administrador Lopes</div></div><div id="content"></div></main>
</div>
<script>
const AUSER="admin", APASS="1234", KEY="lopes_business_v2_state";
const demo={company:"Loja Demonstração",contact:"cliente@exemplo.ao",status:"active",subscription:"active",nextPayment:null,amount:2000,payments:[]};
function state(){try{return JSON.parse(localStorage.getItem(KEY))||{clients:[demo],settings:{monthly:2000}}}catch(e){return {clients:[demo],settings:{monthly:2000}}}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s))}
function money(n){return new Intl.NumberFormat("pt-AO",{style:"currency",currency:"AOA",maximumFractionDigits:0}).format(n).replace("AOA","Kz")}
function login(){if(u.value===AUSER&&p.value===APASS){sessionStorage.admin2="1";document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";page("dash",document.querySelector(".nav button"))}else err.style.display="block"}
function logout(){sessionStorage.removeItem("admin2");location.reload()}
function page(x,b){document.querySelectorAll(".nav button").forEach(z=>z.classList.remove("active"));if(b)b.classList.add("active");let s=state(),c=document.getElementById("content");title.textContent={dash:"Visão geral",clients:"Clientes",subs:"Assinaturas",payments:"Pagamentos",finance:"Financeiro"}[x];
if(x==="dash"){let cs=s.clients||[],active=cs.filter(c=>c.subscription==="active").length,blocked=cs.filter(c=>c.subscription==="blocked").length,rev=cs.reduce((a,c)=>a+(c.payments||[]).filter(p=>p.status==="confirmed").reduce((z,p)=>z+p.amount,0),0);c.innerHTML=`<div class="grid"><div class="card"><div class="label">Clientes</div><div class="value">${cs.length}</div></div><div class="card"><div class="label">Assinaturas ativas</div><div class="value green">${active}</div></div><div class="card"><div class="label">Bloqueadas</div><div class="value red">${blocked}</div></div><div class="card"><div class="label">Receita recebida</div><div class="value orange">${money(rev)}</div></div></div><div class="notice">⚠️ Os valores desta versão são de demonstração. O pagamento real e a confirmação automática entrarão quando ligarmos o backend ao gateway.</div>`}
if(x==="clients"){let cs=s.clients||[];c.innerHTML=`<div class="card"><h2>Contas de clientes</h2><div class="tablewrap"><table class="table"><tr><th>Empresa</th><th>Contacto</th><th>Assinatura</th><th>Próximo pagamento</th><th>Ação</th></tr>${cs.map((a,i)=>`<tr><td><b>${a.company}</b></td><td>${a.contact}</td><td>${badge(a.subscription)}</td><td>${a.nextPayment||"—"}</td><td class="actions"><button class="btn small secondary" onclick="toggle(${i})">${a.subscription==="blocked"?"Ativar":"Bloquear"}</button></td></tr>`).join("")}</table></div></div>`}
if(x==="subs"){let cs=s.clients||[];c.innerHTML=`<div class="grid"><div class="card"><div class="label">Preço mensal</div><div class="value orange">${money(s.settings.monthly)}</div></div><div class="card"><div class="label">Ativas</div><div class="value green">${cs.filter(a=>a.subscription==="active").length}</div></div><div class="card"><div class="label">Em atraso</div><div class="value yellow">${cs.filter(a=>a.subscription==="past_due").length}</div></div><div class="card"><div class="label">Bloqueadas</div><div class="value red">${cs.filter(a=>a.subscription==="blocked").length}</div></div></div><div class="card"><h2>Regras</h2><p class="muted">Avisos previstos: 7 dias, 3 dias, 1 dia e no vencimento. Depois do período de tolerância configurado, a conta passa para bloqueada.</p></div>`}
if(x==="payments"){let rows=[];(s.clients||[]).forEach(a=>(a.payments||[]).forEach(p=>rows.push({...p,company:a.company})));c.innerHTML=`<div class="card"><h2>Pagamentos</h2>${rows.length?`<div class="tablewrap"><table class="table"><tr><th>Empresa</th><th>Data</th><th>Valor</th><th>Estado</th></tr>${rows.reverse().map(p=>`<tr><td>${p.company}</td><td>${p.date}</td><td>${money(p.amount)}</td><td>${badge(p.status)}</td></tr>`).join("")}</table></div>`:"<p class='muted'>Nenhum pagamento registado.</p>"}</div>`}
if(x==="finance"){let cs=s.clients||[],rev=cs.reduce((a,c)=>a+(c.payments||[]).filter(p=>p.status==="confirmed").reduce((z,p)=>z+p.amount,0),0);c.innerHTML=`<div class="card"><h2>Conta da empresa</h2><p class="muted">Área reservada para configurar os dados bancários e o gateway de pagamento.</p><div class="field"><label>Banco</label><input placeholder="Preencher no backend"></div><div class="field"><label>IBAN</label><input placeholder="Preencher no backend"></div><div class="field"><label>Titular da conta</label><input placeholder="Preencher no backend"></div><div class="notice">🔐 Não colocar dados bancários no HTML público. Eles devem ficar protegidos no servidor.</div><h2>Receita confirmada: ${money(rev)}</h2></div>`}}
function badge(v){let t=v==="active"?"Ativa":v==="blocked"?"Bloqueada":v==="past_due"?"Em atraso":v==="confirmed"?"Confirmado":v;let cl=v==="blocked"?"red":v==="past_due"?"yellow":"";return `<span class="badge ${cl}">${t}</span>`}
function toggle(i){let s=state();s.clients[i].subscription=s.clients[i].subscription==="blocked"?"active":"blocked";save(s);page("clients",document.querySelectorAll(".nav button")[1])}
if(sessionStorage.admin2==="1"){login()}
</script>
</body></html>
